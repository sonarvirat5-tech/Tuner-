<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StrumRight - Guitar Tuner</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center;padding:20px}
  h2{margin:0 0 16px;font-size:24px;color:#4caf50}
  .strings{display:flex;justify-content:center;gap:10px;margin-bottom:24px;flex-wrap:wrap}
  .str{width:52px;height:52px;border-radius:50%;border:2px solid #444;background:#222;color:#aaa;font-size:15px;font-weight:bold;cursor:pointer;transition:.2s}
  .str.active{border-color:#4caf50;background:#1a3a1a;color:#fff}
  .str.intune{border-color:#4caf50;background:#4caf50;color:#000}
  .str.sharp{border-color:#f55;background:#3a1a1a;color:#fff}
  .str.flat{border-color:#55f;background:#1a1a3a;color:#fff}
  #note{font-size:88px;margin:10px 0 0;line-height:1}
  #hz{color:#aaa;margin-bottom:16px;font-size:14px}
  #target{font-size:16px;color:#aaa;margin-bottom:12px;height:20px}
  #bar{position:relative;height:24px;background:#333;border-radius:12px;margin:0 auto 8px;max-width:400px}
  #mid{position:absolute;left:50%;top:0;width:2px;height:100%;background:#fff}
  #needle{position:absolute;top:-6px;width:8px;height:36px;background:#f55;border-radius:4px;left:50%;transform:translateX(-50%);transition:left .1s}
  #msg{font-size:20px;height:28px;margin-bottom:16px}
  #cents{font-size:13px;color:#aaa;height:18px}
  button{padding:14px 32px;font-size:18px;border:0;border-radius:12px;background:#4caf50;color:#fff;cursor:pointer}
  #mode{margin-bottom:16px}
  #mode button{padding:8px 18px;font-size:14px;margin:0 4px;background:#333;border-radius:8px}
  #mode button.on{background:#4caf50}
</style>
</head>
<body>
<h2>StrumRight</h2>

<div id="mode">
  <button id="mAuto" class="on" onclick="setMode('auto')">Auto</button>
  <button id="mManual" onclick="setMode('manual')">Pick String</button>
</div>

<div class="strings" id="strButtons">
  <button class="str" data-i="0">E2</button>
  <button class="str" data-i="1">A2</button>
  <button class="str" data-i="2">D3</button>
  <button class="str" data-i="3">G3</button>
  <button class="str" data-i="4">B3</button>
  <button class="str" data-i="5">E4</button>
</div>

<div id="note">--</div>
<div id="target"></div>
<div id="hz">0 Hz</div>
<div id="bar"><div id="mid"></div><div id="needle"></div></div>
<div id="cents"></div>
<div id="msg">Press Start and play a string</div>
<button id="start">Start</button>

<script>
const STRINGS=[
  {name:"E2",freq:82.41},
  {name:"A2",freq:110.00},
  {name:"D3",freq:146.83},
  {name:"G3",freq:196.00},
  {name:"B3",freq:246.94},
  {name:"E4",freq:329.63}
];
const noteNames=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
let mode="auto", selIdx=-1, running=false;

const noteEl=document.getElementById("note"),
      hzEl=document.getElementById("hz"),
      needle=document.getElementById("needle"),
      msg=document.getElementById("msg"),
      targetEl=document.getElementById("target"),
      centsEl=document.getElementById("cents");

function setMode(m){
  mode=m;
  document.getElementById("mAuto").className=m==="auto"?"on":"";
  document.getElementById("mManual").className=m==="manual"?"on":"";
  if(m==="auto"){selIdx=-1;updateStrButtons(-1);}
}

document.querySelectorAll(".str").forEach(b=>{
  b.onclick=()=>{
    if(mode!=="manual") setMode("manual");
    selIdx=+b.dataset.i;
    updateStrButtons(selIdx);
    targetEl.textContent="Tune: "+STRINGS[selIdx].name+" ("+STRINGS[selIdx].freq.toFixed(1)+" Hz)";
  };
});

function updateStrButtons(active){
  document.querySelectorAll(".str").forEach((b,i)=>{
    b.className="str"+(i===active?" active":"");
  });
}

function detectPitch(buf,sr){
  let rms=0;
  for(let i=0;i<buf.length;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/buf.length);
  if(rms<0.003) return -1;
  const minLag=Math.floor(sr/400),maxLag=Math.floor(sr/70);
  const c=new Float32Array(maxLag+2);
  let max=0;
  for(let lag=minLag;lag<=maxLag;lag++){
    let s=0;
    for(let i=0;i<buf.length-lag;i++) s+=buf[i]*buf[i+lag];
    c[lag]=s;
    if(s>max) max=s;
  }
  for(let lag=minLag+1;lag<maxLag;lag++){
    if(c[lag]>=0.9*max&&c[lag]>c[lag-1]&&c[lag]>=c[lag+1]) return sr/lag;
  }
  return -1;
}

function freqToMidi(f){return 69+12*Math.log2(f/440);}

function closestString(f){
  let best=0,bestDiff=Infinity;
  STRINGS.forEach((s,i)=>{
    const d=Math.abs(f-s.freq);
    if(d<bestDiff){bestDiff=d;best=i;}
  });
  return best;
}

document.getElementById("start").onclick=async()=>{
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const src=ctx.createMediaStreamSource(stream);
    const an=ctx.createAnalyser();
    an.fftSize=4096;
    src.connect(an);
    const buf=new Float32Array(an.fftSize);
    document.getElementById("start").style.display="none";
    msg.textContent="Listening...";
    running=true;

    function loop(){
      if(!running) return;
      an.getFloatTimeDomainData(buf);
      const f=detectPitch(buf,ctx.sampleRate);
      if(f>0){
        const midi=freqToMidi(f);
        const r=Math.round(midi);
        const cents=Math.round((midi-r)*100);
        noteEl.textContent=noteNames[((r%12)+12)%12];
        hzEl.textContent=f.toFixed(1)+" Hz";

        // which string are we comparing to?
        const idx=mode==="manual"&&selIdx>=0 ? selIdx : closestString(f);
        if(mode==="auto"){
          updateStrButtons(idx);
          targetEl.textContent="Nearest: "+STRINGS[idx].name;
        }

        // cents relative to target string
        const targetMidi=freqToMidi(STRINGS[idx].freq);
        const centsFromTarget=Math.round((midi-targetMidi)*100);
        centsEl.textContent=centsFromTarget+" cents";
        needle.style.left=(50+Math.max(-45,Math.min(45,centsFromTarget)))+"%";

        const btn=document.querySelectorAll(".str")[idx];
        document.querySelectorAll(".str").forEach((b,i)=>{
          if(i!==idx) b.className="str"+(i===selIdx?" active":"");
        });

        if(Math.abs(centsFromTarget)<=5){
          msg.textContent="✅ In tune!";
          needle.style.background="#4caf50";
          btn.className="str intune";
        } else if(centsFromTarget<0){
          msg.textContent="Too low — tighten the peg";
          needle.style.background="#55f";
          btn.className="str flat";
        } else {
          msg.textContent="Too high — loosen the peg";
          needle.style.background="#f55";
          btn.className="str sharp";
        }
      }
      setTimeout(loop,60);
    }
    loop();
  }catch(e){
    msg.textContent="Mic blocked. Allow mic and reload.";
  }
};
</script>
</body>
</html>
