<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guitar Tuner</title>
<style>
  body{margin:0;background:#111;color:#fff;font-family:sans-serif;text-align:center;padding:24px}
  #note{font-size:96px;margin:30px 0 0}
  #hz{color:#aaa;margin-bottom:24px}
  #bar{position:relative;height:24px;background:#333;border-radius:12px;margin:0 auto;max-width:400px}
  #mid{position:absolute;left:50%;top:0;width:2px;height:100%;background:#fff}
  #needle{position:absolute;top:-6px;width:8px;height:36px;background:#f55;border-radius:4px;left:50%;transform:translateX(-50%)}
  #msg{margin-top:20px;font-size:22px;height:30px}
  button{margin-top:30px;padding:16px 36px;font-size:20px;border:0;border-radius:12px;background:#4caf50;color:#fff}
</style>
</head>
<body>
<h2>Guitar Tuner</h2>
<div id="note">--</div>
<div id="hz">0 Hz</div>
<div id="bar"><div id="mid"></div><div id="needle"></div></div>
<div id="msg">Press Start and play a string</div>
<button id="start">Start</button>

<script>
const names=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const noteEl=document.getElementById("note"),hzEl=document.getElementById("hz"),
      needle=document.getElementById("needle"),msg=document.getElementById("msg");

function detectPitch(buf,sr){
  let rms=0;
  for(let i=0;i<buf.length;i++) rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/buf.length);
  if(rms<0.01) return -1;
  const minLag=Math.floor(sr/400), maxLag=Math.floor(sr/70);
  const c=new Float32Array(maxLag+2);
  let max=0;
  for(let lag=minLag;lag<=maxLag;lag++){
    let s=0;
    for(let i=0;i<buf.length-lag;i++) s+=buf[i]*buf[i+lag];
    c[lag]=s;
    if(s>max) max=s;
  }
  for(let lag=minLag+1;lag<maxLag;lag++){
    if(c[lag]>=0.9*max && c[lag]>c[lag-1] && c[lag]>=c[lag+1]) return sr/lag;
  }
  return -1;
}

document.getElementById("start").onclick=async()=>{
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const src=ctx.createMediaStreamSource(stream);
    const an=ctx.createAnalyser();
    an.fftSize=4096;
    src.connect(an);
    const buf=new Float32Array(an.fftSize);
    document.getElementById("start").style.display="none";
    msg.textContent="Listening...";
    function loop(){
      an.getFloatTimeDomainData(buf);
      const f=detectPitch(buf,ctx.sampleRate);
      if(f>0){
        const m=69+12*Math.log2(f/440);
        const r=Math.round(m);
        const cents=Math.round((m-r)*100);
        noteEl.textContent=names[((r%12)+12)%12];
        hzEl.textContent=f.toFixed(1)+" Hz ("+cents+" cents)";
        needle.style.left=(50+cents)+"%";
        if(Math.abs(cents)<=5){msg.textContent="In tune!";needle.style.background="#4caf50";}
        else if(cents<0){msg.textContent="Too low, tighten the string";needle.style.background="#f55";}
        else{msg.textContent="Too high, loosen the string";needle.style.background="#f55";}
      }
      setTimeout(loop,60);
    }
    loop();
  }catch(e){
    msg.textContent="Mic blocked. Allow the microphone and reload.";
  }
};
</script>
</body>
</html>
